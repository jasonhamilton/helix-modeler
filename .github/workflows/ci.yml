name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: ruff check src tests scripts
      - run: pytest -q
      # Once the synthetic set exists, the benchmark agent adds:
      # - run: python scripts/synthetic_benchmark.py --ci
